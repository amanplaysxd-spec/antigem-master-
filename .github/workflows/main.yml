name: Build AntiGem APKs

on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - 'agy_ide_bridge/**'
      - 'gradle/**'
      - 'gradlew'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/main.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: agy_ide_bridge/go.sum

      - name: Accept Android SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APKs
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleStandardDebug :app:assembleTermuxDebug

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: AntiGem-debug-APKs
          path: |
            app/build/outputs/apk/standard/debug/*.apk
            app/build/outputs/apk/termux/debug/*.apk
          if-no-files-found: error
          retention-days: 14
